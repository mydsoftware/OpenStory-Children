name: Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @openstory/core build
      - run: pnpm --filter @openstory/web build
      - run: pnpm --filter @openstory/web exec playwright install --with-deps chromium
      - run: pnpm --filter @openstory/web exec playwright test ../../playwright.config.ts
